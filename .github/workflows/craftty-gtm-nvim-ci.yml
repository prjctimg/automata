name: "craftty: gtm.nvim ci"
on:
  repository_dispatch:
    types: [gtm-nvim-ci]
concurrency:
  group: craftty-gtm-nvim-ci-${{ github.event.client_payload.sha || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  TARGET_REPO: craftty-org/gtm.nvim
  TARGET_SHA: ${{ github.event.client_payload.sha }}
  TARGET_REF: ${{ github.event.client_payload.ref }}
  STATUS_WORKFLOW: gtm-nvim-ci
jobs:
  status-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record run start
        run: |
          node scripts/status/record-run.mjs --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" --ref "$TARGET_REF" --sha "$TARGET_SHA" --status in_progress --actor "${{ github.event.client_payload.actor || github.actor }}" --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} start [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
  smoke:
    needs: status-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: craftty-org/gtm.nvim
          ref: ${{ github.event.client_payload.sha }}
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.4
      - name: Syntax check
        run: |
          for f in $(find lua plugin scripts -name '*.lua'); do
            nvim --headless -c "lua local f,e=loadfile('$f') if not f then print(e) vim.cmd('cq') end" -c qa \
              || { echo "syntax error in $f"; exit 1; }
          done
      - name: Cross-module reference check
        run: nvim --headless -l scripts/checkrefs.lua
      - name: Headless smoke test
        run: nvim --headless -l scripts/smoke.lua
  lint:
    needs: status-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: craftty-org/gtm.nvim
          ref: ${{ github.event.client_payload.sha }}
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: lunarmodules/luacheck@v1
  status-finish:
    if: always()
    needs: [status-start, smoke, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine conclusion
        id: conclusion
        run: |
          r="${{ needs.smoke.result }}:${{ needs.lint.result }}"
          if echo "$r" | grep -q failure; then echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          elif echo "$r" | grep -q cancelled; then echo "conclusion=cancelled" >> "$GITHUB_OUTPUT"
          else echo "conclusion=success" >> "$GITHUB_OUTPUT"; fi
      - name: Record run finish
        run: |
          node scripts/status/record-run.mjs --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" --ref "$TARGET_REF" --sha "$TARGET_SHA" --status completed --conclusion "${{ steps.conclusion.outputs.conclusion }}" --actor "${{ github.event.client_payload.actor || github.actor }}" --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} ${{ steps.conclusion.outputs.conclusion }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
