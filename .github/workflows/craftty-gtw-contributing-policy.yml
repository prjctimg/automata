name: "craftty: gtw contributing-policy"

on:
  repository_dispatch:
    types: [gtw-contributing-policy]

permissions:
  contents: write

env:
  TARGET_REPO: craftty-org/gtw
  TARGET_SHA: ${{ github.event.client_payload.sha }}
  TARGET_REF: ${{ github.event.client_payload.ref }}
  STATUS_WORKFLOW: gtw-contributing-policy

jobs:
  status-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record run start
        run: |
          node scripts/status/record-run.mjs \
            --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" \
            --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" \
            --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" \
            --ref "$TARGET_REF" --sha "$TARGET_SHA" --status in_progress \
            --actor "${{ github.event.client_payload.actor || github.actor }}" \
            --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} start [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  pr-policy:
    needs: status-start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: craftty-org/gtw
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
      - name: Require issue reference in PR
        env:
          PR_TITLE: ${{ github.event.client_payload.pr_title }}
          PR_BODY: ${{ github.event.client_payload.pr_body }}
        shell: bash
        run: |
          set -euo pipefail
          text="${PR_TITLE}"$'\n'"${PR_BODY:-}"
          if grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|ref(erence)?s?|see)?[[:space:]:]*([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' <<<"$text"; then
            echo "Issue reference found in PR title/body."
          else
            echo "::error::PR must reference an issue (e.g. 'Fixes #123'). Open an issue first, then reference it in the PR title or description."
            exit 1
          fi
      - name: Check for forbidden files
        env:
          BASE_SHA: ${{ github.event.client_payload.base_sha }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files detected."
            exit 0
          fi
          forbidden=()
          for f in "${changed[@]}"; do
            case "$f" in
              target/*|*/target/*|.env|.env.*|*.swp|*.swo|*.swn|*~) forbidden+=("$f") ;;
              *.sqlite|*.sqlite3|*.db|*.db3) forbidden+=("$f") ;;
            esac
          done
          if [ "${#forbidden[@]}" -gt 0 ]; then
            echo "::error::Forbidden files detected in PR (see CONTRIBUTING.md):"
            printf '%s\n' "${forbidden[@]}"
            exit 1
          fi
          echo "No forbidden files detected."

  status-finish:
    if: always()
    needs: [status-start, pr-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine conclusion
        id: conclusion
        run: |
          r="${{ needs.pr-policy.result }}"
          if [ "$r" = "success" ]; then echo "conclusion=success" >> "$GITHUB_OUTPUT"
          elif [ "$r" = "cancelled" ]; then echo "conclusion=cancelled" >> "$GITHUB_OUTPUT"
          else echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Record run finish
        run: |
          node scripts/status/record-run.mjs \
            --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" \
            --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" \
            --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" \
            --ref "$TARGET_REF" --sha "$TARGET_SHA" --status completed \
            --conclusion "${{ steps.conclusion.outputs.conclusion }}" \
            --actor "${{ github.event.client_payload.actor || github.actor }}" \
            --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} ${{ steps.conclusion.outputs.conclusion }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
