name: "craftty: gtm.nvim release"
on:
  repository_dispatch:
    types: [gtm-nvim-release]
permissions:
  contents: write
env:
  TARGET_REPO: craftty-org/gtm.nvim
  TARGET_SHA: ${{ github.event.client_payload.sha }}
  TARGET_REF: ${{ github.event.client_payload.ref }}
  STATUS_WORKFLOW: gtm-nvim-release
jobs:
  status-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record run start
        run: |
          node scripts/status/record-run.mjs --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" --ref "$TARGET_REF" --sha "$TARGET_SHA" --status in_progress --actor "${{ github.event.client_payload.actor || github.actor }}" --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} start [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
  release:
    needs: status-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: craftty-org/gtm.nvim
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
          path: target
      - uses: actions/checkout@v7
        with:
          path: automata
      - name: Derive version
        id: version
        run: |
          ref="${{ github.event.client_payload.ref }}"
          input_ver="${{ github.event.client_payload.inputs.version }}"
          if [[ "$ref" == refs/tags/v* ]]; then
            echo "tag=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "version=${ref#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${input_ver}" >> "$GITHUB_OUTPUT"
            echo "version=${input_ver}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate release notes
        working-directory: target
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          prev_tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^$tag$" | head -1)"
          [[ -n "$prev_tag" ]] || prev_tag="$(git rev-list --max-parents=0 HEAD)"
          bash "$GITHUB_WORKSPACE/automata/scripts/release-notes.sh" "$prev_tag" "${{ github.event.client_payload.sha }}" "$version" release-notes.md
          cat release-notes.md
      - name: Create tarball
        working-directory: target
        run: |
          tar -czf "gtm-nvim-${{ steps.version.outputs.version }}.tar.gz" \
            lua/ plugin/ doc/ README.md LICENSE CHANGELOG.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: craftty-org/gtm.nvim
          token: ${{ secrets.CRAFTTY_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: target/release-notes.md
          files: target/gtm-nvim-${{ steps.version.outputs.version }}.tar.gz

  close-mentioned-issues:
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Close issues mentioned in release
        env:
          GH_TOKEN: ${{ secrets.CRAFTTY_BOT_TOKEN }}
          REPO: craftty-org/gtm.nvim
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          TAG="${TAG:-${{ github.event.client_payload.ref }}}"
          TAG="${TAG#refs/tags/}"
          node scripts/bot/close-mentioned-issues.mjs --repo "$REPO" --tag "$TAG"
  status-finish:
    if: always()
    needs: [status-start, release, close-mentioned-issues]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine conclusion
        id: conclusion
        run: |
          r="${{ needs.release.result }}"
          if [ "$r" = "success" ]; then echo "conclusion=success" >> "$GITHUB_OUTPUT"
          elif [ "$r" = "cancelled" ]; then echo "conclusion=cancelled" >> "$GITHUB_OUTPUT"
          else echo "conclusion=failure" >> "$GITHUB_OUTPUT"; fi
      - name: Record run finish
        run: |
          node scripts/status/record-run.mjs --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" --ref "$TARGET_REF" --sha "$TARGET_SHA" --status completed --conclusion "${{ steps.conclusion.outputs.conclusion }}" --actor "${{ github.event.client_payload.actor || github.actor }}" --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} ${{ steps.conclusion.outputs.conclusion }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
