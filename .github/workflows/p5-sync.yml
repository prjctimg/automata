name: p5.js Sync

on:
  release:
    types: [published]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  P5_SOURCE_DIR: /tmp/p5.js

jobs:
  generate-and-sync:
    runs-on: ubuntu-latest
    name: Generate and Sync

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl pandoc

      - name: Clone p5.js
        run: |
          echo "📥 Cloning p5.js repository..."
          git clone --depth 1 https://github.com/processing/p5.js.git /tmp/p5.js

      - name: Generate p5.js documentation data
        run: |
          echo "📖 Building p5.js documentation data..."
          cd /tmp/p5.js
          mkdir -p docs
          npx documentation build ./src/**/*.js ./src/**/**/*.js --shallow -o docs/data.json
          echo "✅ Documentation data generated"

      - name: Generate TypeScript definitions
        run: |
          echo "📦 Generating TypeScript definitions from p5.js source..."
          ./scripts/p5/types.sh

      - name: Download p5.js modules from releases
        run: |
          echo "📦 Downloading p5.js modules..."
          ./scripts/p5/assets.sh

      - name: Generate Vimdoc documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Starting documentation generation..."
          ./scripts/p5/docs.sh

      - name: Copy static assets
        run: |
          mkdir -p assets/static
          cp static/favicon.ico assets/static/ || true

      - name: Clone p5.nvim repository
        run: |
          echo "📥 Cloning p5.nvim repository..."
          git clone https://x-access-token:${{ secrets.P5NVIM_PUSH_TOKEN }}@github.com/prjctimg/p5.nvim.git /tmp/p5.nvim

      - name: Convert README to text
        run: |
          echo "📝 Converting README to text..."
          cd /tmp/p5.nvim
          pandoc -t plain -o p5.nvim.txt README.md

      - name: Commit and push all artifacts to p5.nvim
        run: |
          echo "📝 Committing all artifacts to p5.nvim..."
          cd /tmp/p5.nvim

          # Copy generated docs
          mkdir -p doc/
          cp -r /home/runner/work/automata/automata/doc/* doc/ || true

          # Copy generated types
          if [ -d "/home/runner/work/automata/automata/assets/types" ]; then
            mkdir -p assets/types
            cp -r /home/runner/work/automata/automata/assets/types/* assets/types/ || true
            echo "✅ Copied types"
          fi

          # Copy generated modules
          if [ -d "/home/runner/work/automata/automata/assets/libs" ]; then
            mkdir -p assets/libs
            cp -r /home/runner/work/automata/automata/assets/libs/* assets/libs/ || true
            echo "✅ Copied modules"
          fi

          # Copy static assets
          if [ -d "/home/runner/work/automata/automata/assets/static" ]; then
            mkdir -p assets/static
            cp -r /home/runner/work/automata/automata/assets/static/* assets/static/ || true
            echo "✅ Copied static assets"
          fi

          # Configure git
          git config user.name "gh-actions"
          git config user.email "actions@github.com"

          # Add and commit changes
          git add doc/ assets/ p5.nvim.txt
          git diff --staged --quiet || git commit -m "docs: autogenerated p5.js assets and documentation"

          # Push changes
          git pull origin main --rebase || true
          git push origin main --force-with-lease

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-artifacts
          path: |
            doc/
            assets/

      - name: Summary
        run: |
          echo "## p5.js Sync Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Generated TypeScript definitions from p5.js source" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Downloaded p5.js library modules" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Generated Vimdoc documentation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Updated p5.nvim repository" >> $GITHUB_STEP_SUMMARY
