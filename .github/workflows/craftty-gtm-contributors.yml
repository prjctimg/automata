name: "craftty: gtm contributors"

on:
  repository_dispatch:
    types: [gtm-contributors]

permissions:
  contents: write

env:
  TARGET_REPO: craftty-org/gtm
  TARGET_SHA: ${{ github.event.client_payload.sha }}
  TARGET_REF: ${{ github.event.client_payload.ref }}
  STATUS_WORKFLOW: gtm-contributors

jobs:
  status-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record run start
        run: |
          node scripts/status/record-run.mjs \
            --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" \
            --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" \
            --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" \
            --ref "$TARGET_REF" --sha "$TARGET_SHA" \
            --status in_progress --actor "${{ github.event.client_payload.actor || github.actor }}" \
            --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} start [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  contributors:
    needs: status-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: automata
      - uses: actions/checkout@v7
        with:
          repository: craftty-org/gtm
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
          path: target
          token: ${{ secrets.CRAFTTY_REPO_TOKEN }}
      - name: Regenerate contributors in README
        run: |
          REPO_ROOT="$GITHUB_WORKSPACE/target" \
            bash "$GITHUB_WORKSPACE/automata/scripts/contributors.sh" "$GITHUB_WORKSPACE/target/README.md"
      - name: Commit if changed
        working-directory: target
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "README already lists every contributor"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update contributors [skip nightly] [skip ci]"
          git push

  status-finish:
    if: always()
    needs: [status-start, contributors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine conclusion
        id: conclusion
        run: |
          r="${{ needs.contributors.result }}"
          if [ "$r" = "success" ]; then echo "conclusion=success" >> "$GITHUB_OUTPUT"
          elif [ "$r" = "cancelled" ]; then echo "conclusion=cancelled" >> "$GITHUB_OUTPUT"
          else echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Record run finish
        run: |
          node scripts/status/record-run.mjs \
            --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" \
            --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" \
            --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" \
            --ref "$TARGET_REF" --sha "$TARGET_SHA" \
            --status completed --conclusion "${{ steps.conclusion.outputs.conclusion }}" \
            --actor "${{ github.event.client_payload.actor || github.actor }}" \
            --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} ${{ steps.conclusion.outputs.conclusion }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
