name: "craftty: gtm.nvim what-changed"
on:
  repository_dispatch:
    types: [gtm-nvim-what-changed]
permissions:
  contents: write
env:
  TARGET_REPO: craftty-org/gtm.nvim
  TARGET_SHA: ${{ github.event.client_payload.sha }}
  TARGET_REF: ${{ github.event.client_payload.ref }}
  STATUS_WORKFLOW: gtm-nvim-what-changed
jobs:
  status-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record run start
        run: |
          node scripts/status/record-run.mjs --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" --ref "$TARGET_REF" --sha "$TARGET_SHA" --status in_progress --actor "${{ github.event.client_payload.actor || github.actor }}" --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} start [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
  report:
    needs: status-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: automata
      - uses: actions/checkout@v7
        with:
          repository: craftty-org/gtm.nvim
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
          path: target
      - name: Generate report
        id: report
        run: |
          python3 automata/scripts/what-changed.py --repo target --since "7 days ago" --out what-changed.md
          if grep -q "<!-- what-changed: empty -->" what-changed.md; then echo "empty=true" >> "$GITHUB_OUTPUT"; else echo "empty=false" >> "$GITHUB_OUTPUT"; fi
      - name: Open issue
        if: steps.report.outputs.empty != 'true'
        uses: actions/github-script@v8
        env:
          TARGET_REPO: craftty-org/gtm.nvim
        with:
          github-token: ${{ secrets.CRAFTTY_REPO_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('what-changed.md', 'utf8');
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            const title = `What changed — ${new Date().toISOString().slice(0,10)}`;
            await github.rest.issues.create({ owner, repo, title, body });
  status-finish:
    if: always()
    needs: [status-start, report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine conclusion
        id: conclusion
        run: |
          r="${{ needs.report.result }}"
          if [ "$r" = "success" ]; then echo "conclusion=success" >> "$GITHUB_OUTPUT"
          elif [ "$r" = "cancelled" ]; then echo "conclusion=cancelled" >> "$GITHUB_OUTPUT"
          else echo "conclusion=failure" >> "$GITHUB_OUTPUT"; fi
      - name: Record run finish
        run: |
          node scripts/status/record-run.mjs --repo "$TARGET_REPO" --workflow "$STATUS_WORKFLOW" --run-id "${{ github.run_id }}" --run-number "${{ github.run_number }}" --event "${{ github.event.client_payload.event_name || 'repository_dispatch' }}" --ref "$TARGET_REF" --sha "$TARGET_SHA" --status completed --conclusion "${{ steps.conclusion.outputs.conclusion }}" --actor "${{ github.event.client_payload.actor || github.actor }}" --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "status: $STATUS_WORKFLOW $TARGET_REPO@${TARGET_SHA::7} ${{ steps.conclusion.outputs.conclusion }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
